name: Deploy Feedback API

# Trigger: every push to the main branch kicks off a deploy.
on:
  push:
    branches: [main]

# Prevent overlapping deploys if you push twice quickly.
concurrency:
  group: deploy-feedback-api
  cancel-in-progress: false

# OIDC: GitHub mints a short-lived token for this run and AWS exchanges it for
# temporary credentials. `id-token: write` is what allows that token to be issued —
# without it the deploy fails with a confusing "could not load credentials" error.
# Declaring any permission resets the rest to none, hence `contents: read` for checkout.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # No static credentials anywhere. This exchanges the run's OIDC token for
      # temporary credentials via a role whose trust policy is pinned to this repo
      # and the main branch — see oidc/trust-github-oidc.json.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::122066462950:role/GitHubActionsDeployRole
          aws-region: ap-southeast-1

      - name: SAM build
        run: sam build

      - name: SAM deploy
        run: |
          sam deploy \
            --stack-name feedback-api-serverless \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM
